ss<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="topbar">
      <h1 class="logo">Life Dashboard</h1>
      <button id="themeToggle" class="icon-btn" title="Ganti tema" aria-label="Ganti tema">🌙</button>
    </header>

    <!-- Greeting Widget -->
    <section class="card greeting-card">
      <div class="greeting-text">
        <p class="greeting-line" id="greetingLine">Good Morning</p>
        <h2 class="greeting-name" id="greetingName">
          <span id="displayName">Teman</span>
          <button id="editNameBtn" class="icon-btn small" title="Ubah nama" aria-label="Ubah nama">✏️</button>
        </h2>
      </div>
      <div class="clock">
        <p class="time" id="clockTime">00:00:00</p>
        <p class="date" id="clockDate">-</p>
      </div>
    </section>

    <!-- Main Grid: Timer + Tasks -->
    <div class="grid-main">

      <!-- Focus Timer Widget -->
      <section class="card timer-card">
        <h3 class="card-title">⏱️ Focus Timer</h3>
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="timer-progress">
          <div class="timer-progress-bar" id="timerProgressBar"></div>
        </div>
        <div class="timer-controls">
          <button id="timerStart" class="btn primary">Start</button>
          <button id="timerStop" class="btn">Stop</button>
          <button id="timerReset" class="btn ghost">Reset</button>
        </div>
      </section>

      <!-- To-Do List Widget -->
      <section class="card todo-card">
        <h3 class="card-title">✅ To-Do List</h3>
        <form id="todoForm" class="todo-form" autocomplete="off">
          <input type="text" id="todoInput" class="input" placeholder="Tugas baru..." maxlength="120" />
          <button type="submit" class="btn primary">Tambah</button>
        </form>
        <p id="todoMessage" class="todo-message" aria-live="polite"></p>
        <div class="todo-meta">
          <span id="todoStats">0 tugas · 0 selesai</span>
          <button id="clearDone" class="link-btn">Hapus selesai</button>
        </div>
        <ul class="todo-list" id="todoList"></ul>
        <p id="todoEmpty" class="empty-state">Belum ada tugas. Tambahkan yang pertama!</p>
      </section>

    </div>

    <!-- Quick Links Widget -->
    <section class="card links-card">
      <h3 class="card-title">🔗 Quick Links</h3>
      <form id="linkForm" class="link-form" autocomplete="off">
        <input type="text" id="linkName" class="input" placeholder="Nama (mis. GitHub)" maxlength="40" />
        <input type="text" id="linkUrl" class="input" placeholder="URL (mis. github.com)" maxlength="200" />
        <button type="submit" class="btn primary">Tambah Link</button>
      </form>
      <p id="linkMessage" class="todo-message" aria-live="polite"></p>
      <div class="link-grid" id="linkGrid"></div>
    </section>

    <footer class="footer">Data tersimpan lokal di browser Anda.</footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
